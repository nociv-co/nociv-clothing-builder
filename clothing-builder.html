<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOCIV V4 Pattern Generator</title>
  <link rel="stylesheet" href="./src/styles.css">
</head>
<body>
  <div id="app">
    <!-- 1. Interactive Control Panel -->
    <aside id="sidebar">
      <h1>NOCIV Engine V4</h1>
      
      <section id="step-selector">
        <label for="archetype">Select Garment</label>
        <select id="archetype">
          <option value="pants">Pants</option>
          <option value="tee">T-Shirt</option>
        </select>
      </section>

      <!-- Dynamic Form Container Populated by JS -->
      <form id="measurement-form">
        <div id="input-fields"></div>
        <button type="submit" id="btn-generate">Draft Pattern</button>
      </form>
    </aside>

    <!-- 2. Pattern Preview & Metrics Engine -->
    <main id="workspace">
      <header id="confidence-header">
        <span id="fit-score">Confidence Score: --</span>
      </header>

      <!-- SVG Path Output Target -->
      <div id="canvas-container">
        <svg id="pattern-canvas" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000"></svg>
      </div>

      <footer id="actions">
        <button id="btn-export">Export Tiled PDF</button>
      </footer>
    </main>
  </div>

  <!-- 3. Import Main JavaScript Entry Point -->
  <script type="module" src="./src/main.js"></script>
</body>
</html>
