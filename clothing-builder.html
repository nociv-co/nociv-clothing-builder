<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOCIV V4 Pattern Generator</title>
  <link rel="stylesheet" href="./src/styles.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <h1>NOCIV Engine V4</h1>
      
      <div class="control-group">
        <label for="archetype">Garment Archetype</label>
        <select id="archetype">
          <option value="pants">Pants</option>
          <option value="tee">T-Shirt</option>
        </select>
      </div>

      <div class="control-group">
        <label for="input-mode">Measurement Mode</label>
        <select id="input-mode">
          <option value="body">Measure Body</option>
          <option value="garment_flat">Copy Existing Garment</option>
        </select>
      </div>

      <form id="measurement-form">
        <div id="dynamic-inputs">
          <label>Waist (inches)</label>
          <input type="number" name="waist" value="32" step="0.25" required>
          
          <label>Hip (inches)</label>
          <input type="number" name="hip" value="40" step="0.25" required>
          
          <label>Inseam / Length (inches)</label>
          <input type="number" name="length" value="30" step="0.25" required>
        </div>
        <button type="submit" id="btn-generate">Generate Draft</button>
      </form>
    </aside>

    <main id="workspace">
      <header id="confidence-header">
        <div id="fit-score">Confidence Score: --</div>
      </header>

      <div id="canvas-container">
        <svg id="pattern-canvas" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000"></svg>
      </div>

      <footer id="actions">
        <button id="btn-export">Export Tiled PDF</button>
      </footer>
    </main>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
